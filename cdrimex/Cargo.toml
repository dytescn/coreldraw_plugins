[package]
name = "cdrimex"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "cdrimex"

[dependencies]
cdrsdk = "0.2.0"
libc = "0.2"             # C 基础类型
once_cell = "1.19"       # 全局初始化
serde = { version = "1.0", features = ["derive"] }
serde_derive = "1.0"
serde_json = "1.0"
wincom = "0.2.0"
windows = {
    version = "0.52.0", features = [
        "Win32_System_Com",
        "Data_Xml_Dom",
        "Win32_Foundation",
        "Win32_Security",
        "Win32_System_Threading",
        "Win32_System_Ole",
        "Win32_System_Variant",
    ]}
